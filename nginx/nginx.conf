events {
    worker_connections 1024;
}

http {
    server_tokens off;

    add_header X-Frame-Options           "SAMEORIGIN"              always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header X-XSS-Protection          "1; mode=block"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Rate limiting — 20 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP: certbot challenge + redirect to HTTPS ────────────────────────
    server {
        listen 80;
        server_name countererrorists.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name countererrorists.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/countererrorists.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/countererrorists.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        # ── Streamlit UI at /ui ──────────────────────────────────────────
        location /ui/ {
            proxy_pass         http://streamlit:8501/ui/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support (required by Streamlit)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # ── FastAPI backend at / ─────────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass         http://fastapi:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
